<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200, height=630" />
  <title>OG Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Anek Malayalam', system-ui, sans-serif;
    }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #f7c948 0%, #f0a830 40%, #e89820 100%);
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Subtle decorative circle */
    .og::before {
      content: '';
      position: absolute;
      right: -80px;
      top: -120px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
    }

    /* Subtle bottom-left circle */
    .og::after {
      content: '';
      position: absolute;
      left: -100px;
      bottom: -160px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 56px 64px;
      flex: 1;
      max-width: 650px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 8px 22px 8px 10px;
      margin-bottom: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .badge img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .badge span {
      font-size: 17px;
      font-weight: 700;
      color: #1a56a8;
    }

    .title {
      font-weight: 800;
      line-height: 1.22;
      color: #fff;
      text-shadow: 0 3px 12px rgba(120, 60, 0, 0.2);
    }

    .title .line1 {
      display: block;
      font-size: 72px;
    }

    .title .line2 {
      display: block;
      font-size: 46px;
      font-weight: 600;
      opacity: 0.95;
      margin-top: 2px;
    }

    .title .line3 {
      display: block;
      font-size: 68px;
      margin-top: 4px;
    }

    .meta {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 20px;
      font-weight: 600;
      width: fit-content;
    }

    .meta-date {
      background: rgba(40, 30, 15, 0.82);
      color: #fff;
    }

    .meta-loc {
      background: rgba(40, 30, 15, 0.65);
      color: #fff;
    }

    .illustration {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 560px;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .illustration img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 32px rgba(80,40,0,0.2));
    }

    /* Dotgrid decoration */
    .dotgrid {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 100px;
      height: 100px;
      z-index: 3;
      background-image: radial-gradient(rgba(255,255,255,0.3) 1.6px, transparent 1.6px);
      background-size: 14px 14px;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="dotgrid"></div>

    <div class="content">
      <div class="badge">
        <!-- inline SVG logo placeholder for the balasangham circle logo -->
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="17" stroke="#1a56a8" stroke-width="2" fill="#fff"/>
          <circle cx="18" cy="18" r="14" fill="#e8f0fe"/>
          <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#1a56a8">☮</text>
        </svg>
        <span>ബാലസംഘം</span>
      </div>

      <h1 class="title">
        <span class="line1">ബാലസംഘം</span>
        <span class="line2">പിണറായി ഏരിയ</span>
        <span class="line3">സമ്മേളനം</span>
      </h1>

      <div class="meta">
        <div class="meta-item meta-date">
          📅 2026 സെപ്റ്റംബർ 6
        </div>
        <div class="meta-item meta-loc">
          📍 കോട്ടയം അങ്ങാടി, കണ്ണൂർ
        </div>
      </div>
    </div>

    <div class="illustration">
      <img src="../src/assets/hero-children.webp" alt="" />
    </div>
  </div>
</body>
</html>
